name: Adversarial

# Red-team suite that attacks the HATEOAS security model against the live
# Claude API. Runs nightly and on demand. Skips cleanly when the
# ANTHROPIC_API_KEY secret is not configured (e.g. on forks).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  red-team:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY secret not set — skipping adversarial run."
          fi

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[anthropic]"

      - name: Run adversarial suite
        if: steps.key.outputs.present == 'true'
        run: python3 tests/test_adversarial.py
